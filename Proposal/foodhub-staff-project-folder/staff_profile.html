<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOODHUB — Staff Profile</title>
    <!-- Google Fonts Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="css/staff_profile.css">
    <link rel="stylesheet" href="css/sidebar_nav.css">
    <link rel="stylesheet" href="css/topbar_nav.css">
</head>

<body>

    <div class="admin-layout">

        <!-- SIDE NAVBAR -->
        <div id="sidebar-nav-container"></div>

        <!-- MAIN CONTENT AREA -->
        <main class="main-content">

            <!-- TOP NAVBAR -->
            <div id="top-navbar-container"></div>

            <div class="staff-profile-body">

                <div class="page-header">
                    <h1>My Staff Profile</h1>
                    <p>View your employee profile and update your account credentials.</p>
                </div>

                <div class="profile-grid">

                    <!-- LEFT COLUMN: PROFILE CARD -->
                    <div class="profile-sidebar">
                        <div class="card-box text-center">
                            <div class="avatar-wrapper">
                                <div class="avatar-placeholder">
                                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2">
                                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                        <circle cx="12" cy="7" r="4"></circle>
                                    </svg>
                                </div>
                            </div>
                            <h3 id="profileHeaderName" class="profile-name">Juan Dela Cruz</h3>
                            <span id="displayRole" class="badge badge-primary">Staff Member</span>
                        </div>
                    </div>

                    <!-- RIGHT COLUMN: DETAILS & FORMS -->
                    <div class="profile-content-area">

                        <!-- SECTION 1: PERSONAL DETAILS -->
                        <div class="card-box margin-bottom-24">
                            <div class="card-header-flex">
                                <svg class="section-icon text-primary" width="20" height="20" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                                </svg>
                                <div>
                                    <h3 class="card-title">Personal Details</h3>
                                    <p class="card-subtitle">Manage your name and account email address.</p>
                                </div>
                            </div>

                            <form id="staffProfileForm" class="profile-form">
                                <div class="form-grid-2">
                                    <div class="form-group">
                                        <label for="inputFullName">Full Name</label>
                                        <input type="text" id="inputFullName" class="form-control" required>
                                    </div>
                                    <div class="form-group">
                                        <label for="inputEmail">Email Address</label>
                                        <input type="email" id="inputEmail" class="form-control" required>
                                    </div>
                                </div>
                                <div class="form-actions">
                                    <button type="submit" class="btn-primary">Update Details</button>
                                </div>
                            </form>
                        </div>

                        <!-- SECTION 2: PASSWORD & SECURITY -->
                        <div class="card-box">
                            <div class="card-header-flex">
                                <svg class="section-icon text-warning" width="20" height="20" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                                <div>
                                    <h3 class="card-title">Password & Security</h3>
                                    <p class="card-subtitle">Keep your account secure by updating your password when
                                        needed.</p>
                                </div>
                            </div>

                            <form id="securityForm" class="profile-form">
                                <div class="form-group">
                                    <label for="inputCurrentPassword">Current Password</label>
                                    <input type="password" id="inputCurrentPassword" class="form-control"
                                        placeholder="••••••••" required>
                                </div>
                                <div class="form-grid-2">
                                    <div class="form-group">
                                        <label for="inputNewPassword">New Password</label>
                                        <input type="password" id="inputNewPassword" class="form-control"
                                            placeholder="••••••••" required>
                                    </div>
                                    <div class="form-group">
                                        <label for="inputConfirmPassword">Confirm New Password</label>
                                        <input type="password" id="inputConfirmPassword" class="form-control"
                                            placeholder="••••••••" required>
                                    </div>
                                </div>
                                <div class="form-actions">
                                    <button type="submit" class="btn-primary">Change Password</button>
                                </div>
                            </form>
                        </div>

                    </div>

                </div>

            </div>

        </main>

    </div>

    <!-- Auth Guard - Must load before StaffProfileController -->
    <script type="module">
        import { protectPage } from '../foodhub-admin-root-project-folder/js/utils/AuthGuard.js';

        // Protect this page - STAFF and ADMIN can access
        protectPage({ allowedRoles: ['STAFF'] }).then(userData => {
            if (userData) {
                window.currentUser = userData;
            }
        });
    </script>

    <!-- JavaScript Entry Point -->
    <script type="module" src="js/controllers/StaffProfileController.js"></script>

</body>

</html>
