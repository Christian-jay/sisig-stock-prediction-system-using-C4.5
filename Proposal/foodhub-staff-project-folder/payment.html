<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FOODHUB — Orders / Payment</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Global Navigation -->
    <link rel="stylesheet" href="css/sidebar_nav.css">
    <link rel="stylesheet" href="css/topbar_nav.css">

    <!-- Payment Page CSS -->
    <link rel="stylesheet" href="css/payment.css">
</head>

<body>

    <div class="admin-layout">

        <!-- =========================================
         SIDEBAR
         ========================================= -->
        <div id="sidebar-nav-container"></div>


        <!-- =========================================
         MAIN CONTENT
         ========================================= -->
        <main class="main-content">

            <!-- TOP NAVBAR -->
            <div id="top-navbar-container"></div>


            <!-- =========================================
             PAGE CONTENT
             ========================================= -->
            <div class="content-body">

                <!-- PAGE HEADER -->
                <header class="page-header">
                    <div class="page-header-text">
                        <h1>Orders <span class="header-separator">/</span> Payment</h1>
                        <p>Complete the payment for this order.</p>
                    </div>
                </header>

                <!-- =====================================
     ORDER SUMMARY CARD
     ===================================== -->
                <section class="card order-summary-card">

                    <!-- Card Header -->
                    <div class="summary-card-header">
                        <div class="summary-title-group">
                            <div class="summary-icon-box">
                                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                    <polyline points="14 2 14 8 20 8"></polyline>
                                </svg>
                            </div>
                            <h2>Order Summary</h2>
                        </div>

                        <div class="order-meta">
                            <span class="order-timestamp" id="orderTimestamp">Apr 27, 2025 • 10:24 AM</span>
                        </div>
                    </div>

                    <!-- =====================================
         LEFT SIDE CONTAINER (Customer & Table)
         ===================================== -->
                    <div class="payment-left-column">

                        <!-- Order Details Bar -->
                        <div class="customer-bar">
                            <div class="customer-info">
                                <div class="customer-avatar">
                                    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                        <polyline points="14 2 14 8 20 8"></polyline>
                                    </svg>
                                </div>
                                <div class="customer-details">
                                    <span class="customer-label">Order Number</span>
                                    <span class="customer-name" id="orderIdText">#1001</span>
                                </div>
                            </div>

                            <!-- Right Side: Order Type & Payment Status Dropdown -->
                            <div class="customer-bar-right">
                                <span class="badge badge-order-type" id="orderTypeBadge">Takeout</span>

                                <div class="status-dropdown-wrapper">
                                    <select id="paymentStatusSelect" class="status-select status-unpaid">
                                        <option value="unpaid" selected>Unpaid</option>
                                        <option value="paid">Paid</option>
                                    </select>
                                    <svg class="dropdown-icon" width="14" height="14" viewBox="0 0 24 24" fill="none"
                                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <polyline points="6 9 12 15 18 9"></polyline>
                                    </svg>
                                </div>
                            </div>
                        </div>

                        <!-- Itemized Order Table -->
                        <div class="table-responsive">
                            <table class="order-table">
                                <thead>
                                    <tr>
                                        <th class="col-item">Item</th>
                                        <th class="text-center col-qty">Qty</th>
                                        <th class="text-right col-price">Unit Price</th>
                                        <th class="text-right col-total">Total</th>
                                    </tr>
                                </thead>
                                <tbody id="paymentTableBody">
                                    <!-- Dynamically populated by PaymentController -->
                                </tbody>
                            </table>
                        </div>

                    </div>

                    <!-- RIGHT SIDE CHECKOUT COLUMN (Desktop) -->
                    <div class="payment-right-column">
                        <!-- Payment Method Selection -->
                        <div class="payment-method-section">
                            <label class="payment-method-label" for="paymentMethodSelect">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
                                    <line x1="1" y1="10" x2="23" y2="10"></line>
                                </svg>
                                Payment Method
                            </label>
                            <div class="select-wrapper">
                                <select id="paymentMethodSelect" class="payment-method-select">
                                    <option value="cash" data-type="cash" selected>Cash</option>
                                    <option value="gcash" data-type="gcash">GCash</option>
                                    <option value="maya" data-type="maya">Maya</option>
                                    <option value="foodpanda" data-type="foodpanda">Foodpanda</option>
                                </select>
                                <svg class="select-dropdown-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <polyline points="6 9 12 15 18 9"></polyline>
                                </svg>
                            </div>
                        </div>

                        <!-- PWD / Senior Discount Section -->
                        <div class="discount-section">
                            <div class="discount-header">
                                <label class="discount-title" for="pwdDiscountToggle">
                                    PWD / Senior Discount
                                </label>

                                <label class="switch">
                                    <input type="checkbox" id="pwdDiscountToggle">
                                    <span class="slider round"></span>
                                </label>
                            </div>

                            <div class="discount-controls" id="discountControls" style="display: none;">
                                <div class="discount-input-group">
                                    <label for="discountRateInput">Discount (%)</label>
                                    <div class="input-with-symbol">
                                        <input type="number" id="discountRateInput" class="discount-input" value="20"
                                            min="0" max="100" step="1">
                                        <span class="symbol-right">%</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Payment Totals Breakdown -->
                        <div class="payment-breakdown-box">
                            <div class="breakdown-row">
                                <span>Subtotal</span>
                                <span id="paymentSubtotal">₱0.00</span>
                            </div>
                            <div class="breakdown-row">
                                <span>Tax (12%)</span>
                                <span id="paymentTax">₱0.00</span>
                            </div>
                            <div class="breakdown-row total-row">
                                <span>Total Amount</span>
                                <span class="total-price" id="paymentTotal">₱0.00</span>
                            </div>
                        </div>

                        <!-- Footer Actions -->
                        <footer class="payment-actions">
                            <a href="orders.html" class="btn-back">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="15 18 9 12 15 6"></polyline>
                                </svg>
                                Back
                            </a>

                            <button class="btn-pay" id="btnConfirmPay" type="button">
                                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="2" y="5" width="20" height="14" rx="2"></rect>
                                    <line x1="2" y1="10" x2="22" y2="10"></line>
                                </svg>
                                Pay
                            </button>
                        </footer>
                    </div>

                </section>

            </div>

        </main>

    </div>

    <!-- JavaScript Controller -->
    <script type="module" src="js/controllers/PaymentController.js"></script>

</body>

</html>
