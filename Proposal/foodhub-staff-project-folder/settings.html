<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FOODHUB — Staff System Settings</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Theme System (load FIRST to prevent flash) -->
    <link rel="stylesheet" href="css/themes.css">
    <!-- Page Stylesheets -->
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="css/sidebar_nav.css">
    <link rel="stylesheet" href="css/topbar_nav.css">
    <!-- No-flash theme initialization (runs before paint) -->
    <script>
        (function() {
            const theme = localStorage.getItem('foodhub_theme');
            if (theme === 'light' || theme === 'dark') {
                document.documentElement.dataset.theme = theme;
                document.body.dataset.theme = theme;
            }
        })();
    </script>
</head>

<body>

    <div class="admin-layout">

        <!-- SIDEBAR -->
        <div id="sidebar-nav-container"></div>

        <!-- ================= MAIN CONTENT ================= -->
        <main class="main-content">

            <!-- TOP NAVBAR -->
            <div id="top-navbar-container"></div>

            <!-- PAGE CONTENT -->
            <div class="settings-dashboard-body">

                <!-- PAGE HEADER -->
                <section class="page-header" style="margin-bottom: 24px;">
                    <div>
                        <h2 class="page-title">System Settings</h2>
                        <p class="page-subtitle">Configure general preferences, themes, notifications, and system backups.</p>
                    </div>
                </section>

                <!-- LOADING STATE -->
                <div id="settingsLoadingState" class="loading-state" style="display: none;">
                    <div class="spinner"></div>
                    <p class="text-muted">Loading settings...</p>
                </div>

                <!-- ERROR STATE -->
                <div id="settingsErrorState" class="error-state" style="display: none;">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom: 12px; opacity: 0.6;">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <p>Failed to load settings</p>
                    <p class="text-muted font-13" id="settingsErrorMessage"></p>
                    <button class="btn-retry" id="settingsRetryBtn">Retry</button>
                </div>

                <div class="settings-layout-grid" id="settingsContentGrid" style="display: none;">

                    <!-- LEFT SIDEBAR MENU CARD -->
                    <div class="settings-menu-card">
                        <ul class="settings-menu-list">
                            <li class="settings-menu-item active" data-tab="general">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <circle cx="12" cy="12" r="3"></circle>
                                    <path
                                        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l-.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                                    </path>
                                </svg>
                                <span>General</span>
                            </li>
                            <li class="settings-menu-item" data-tab="notification">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                                </svg>
                                <span>Notification</span>
                            </li>
                            <li class="settings-menu-item" data-tab="backup">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                    <polyline points="17 8 12 3 7 8"></polyline>
                                    <line x1="12" y1="3" x2="12" y2="15"></line>
                                </svg>
                                <span>Backup & Logout</span>
                            </li>
                        </ul>
                    </div>

                    <!-- RIGHT CONTENT CARD -->
                    <div class="settings-content-card">
                        <form id="staffSettingsForm">
                            <div id="staffTabContent">
                                <!-- Dynamic form tab content -->
                            </div>
                        </form>
                    </div>

                </div>

            </div>

        </main>

    </div>

    <!-- Theme Manager - Initialize global theme system -->
    <script type="module">
        import { ThemeManager } from './js/utils/ThemeManager.js';
        import { SettingsService } from './js/services/SettingsService.js';

        const themeManager = new ThemeManager({ settingsService: new SettingsService() });
        await themeManager.init();
        window.themeManager = themeManager; // Expose globally for debugging
    </script>

    <!-- Auth Guard - Must load before SettingsController -->
    <script type="module">
        import { protectPage } from '../foodhub-admin-root-project-folder/js/utils/AuthGuard.js';

        // Protect this page - STAFF and ADMIN can access
        protectPage({ allowedRoles: ['STAFF'] }).then(userData => {
            if (userData) {
                window.currentUser = userData;
            }
        });
    </script>

    <script type="module" src="js/controllers/SettingsController.js"></script>

</body>

</html>
