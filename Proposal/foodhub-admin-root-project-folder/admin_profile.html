<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FOODHUB — Admin Profile</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/admin_profile.css">
    <link rel="stylesheet" href="../foodhub-staff-project-folder/css/themes.css">
    <link rel="stylesheet" href="css/sidebar_nav.css">
    <link rel="stylesheet" href="css/topbar_nav.css">
</head>

<body>
    <!-- Apply saved theme immediately (before paint) -->
    <script>
      (function() {
        const theme = localStorage.getItem('foodhub_theme');
        if (theme === 'dark') {
          document.body.setAttribute('data-theme', theme);
        }
      })();
    </script>
    <div class="admin-layout">

        <!-- SIDE NAVBAR -->
        <div id="sidebar-nav-container"></div>

        <!-- MAIN CONTENT -->
        <main class="main-content">

            <!-- TOP NAVBAR -->
            <div id="top-navbar-container"></div>

            <div class="admin-profile-body">

                <!-- PAGE HEADER -->
                <div class="page-header">
                    <h1>My Admin Profile</h1>
                    <p>Manage your administrator profile and account security.</p>
                </div>

                <div class="profile-grid">

                    <!-- LEFT PROFILE CARD -->
                    <div class="profile-sidebar">

                        <div class="card-box text-center">

                            <div class="avatar-wrapper">
                                <div class="avatar-placeholder">

                                    <svg width="40" height="40"
                                        viewBox="0 0 24 24"
                                        fill="none"
                                        stroke="currentColor"
                                        stroke-width="2"
                                        stroke-linecap="round"
                                        stroke-linejoin="round">

                                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                        <circle cx="12" cy="7" r="4"></circle>

                                    </svg>

                                </div>
                            </div>

                            <h3 id="profileHeaderName" class="profile-name">
                                Carlos Mendoza
                            </h3>

                            <span id="displayRole" class="badge badge-primary">
                                Administrator
                            </span>

                        </div>

                    </div>

                    <!-- RIGHT CONTENT -->
                    <div class="profile-content-area">

                        <!-- PERSONAL DETAILS -->
                        <div class="card-box margin-bottom-24">

                            <div class="card-header-flex">

                                <svg class="section-icon text-primary"
                                    width="20"
                                    height="20"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round">

                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>

                                </svg>

                                <div>
                                    <h3 class="card-title">
                                        Administrator Details
                                    </h3>

                                    <p class="card-subtitle">
                                        Manage your administrator name and account email address.
                                    </p>
                                </div>

                            </div>

                            <form id="adminProfileForm" class="profile-form">

                                <div class="form-grid-2">

                                    <div class="form-group">

                                        <label for="inputFullName">
                                            Full Name
                                        </label>

                                        <input
                                            type="text"
                                            id="inputFullName"
                                            class="form-control"
                                            required>

                                    </div>

                                    <div class="form-group">

                                        <label for="inputEmail">
                                            Email Address
                                        </label>

                                        <input
                                            type="email"
                                            id="inputEmail"
                                            class="form-control"
                                            required>

                                    </div>

                                </div>

                                <div class="form-actions">

                                    <button
                                        type="submit"
                                        class="btn-primary">

                                        Update Profile

                                    </button>

                                </div>

                            </form>

                        </div>

                        <!-- PASSWORD & SECURITY -->
                        <div class="card-box">

                            <div class="card-header-flex">

                                <svg class="section-icon text-warning"
                                    width="20"
                                    height="20"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round">

                                    <rect
                                        x="3"
                                        y="11"
                                        width="18"
                                        height="11"
                                        rx="2"
                                        ry="2">
                                    </rect>

                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>

                                </svg>

                                <div>

                                    <h3 class="card-title">
                                        Password & Security
                                    </h3>

                                    <p class="card-subtitle">
                                        Protect your administrator account by regularly updating your password.
                                    </p>

                                </div>

                            </div>

                            <form id="adminSecurityForm" class="profile-form">

                                <div class="form-group">

                                    <label for="inputCurrentPassword">
                                        Current Password
                                    </label>

                                    <input
                                        type="password"
                                        id="inputCurrentPassword"
                                        class="form-control"
                                        placeholder="••••••••"
                                        required>

                                </div>

                                <div class="form-grid-2">

                                    <div class="form-group">

                                        <label for="inputNewPassword">
                                            New Password
                                        </label>

                                        <input
                                            type="password"
                                            id="inputNewPassword"
                                            class="form-control"
                                            placeholder="••••••••"
                                            required>

                                    </div>

                                    <div class="form-group">

                                        <label for="inputConfirmPassword">
                                            Confirm New Password
                                        </label>

                                        <input
                                            type="password"
                                            id="inputConfirmPassword"
                                            class="form-control"
                                            placeholder="••••••••"
                                            required>

                                    </div>

                                </div>

                                <div class="form-actions">

                                    <button
                                        type="submit"
                                        class="btn-primary">

                                        Change Password

                                    </button>

                                </div>

                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </main>

    </div>

    <!-- Auth Guard - Must load before AdminProfileController -->
    <script type="module">
        import { protectPage } from './js/utils/AuthGuard.js';

        // Protect this page - only ADMIN can access
        protectPage({ allowedRoles: ['ADMIN'] }).then(userData => {
            if (userData) {
                window.currentUser = userData;
            }
        });
    </script>

    <script
        type="module"
        src="js/controllers/AdminProfileController.js">
    </script>

</body>

</html>
