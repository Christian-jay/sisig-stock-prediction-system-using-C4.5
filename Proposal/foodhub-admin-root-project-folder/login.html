<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOODHUB — Admin Portal</title>
    <!-- Google Fonts Inter para sa modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <main class="login-page">

        <!-- LEFT SIDE: Modern Hero & Brand Banner -->
        <section class="hero-section">
            <div class="hero-overlay"></div>
            <div class="hero-content">
                <div class="brand-badge">
                    <!-- <span class="badge-dot"></span> Admin Portal    -->
                </div>

                <!-- Bagong container para magkatabi ang logo at heading -->
                <div class="brand-header-flex">
                    <!-- Opsyon A: Gamit ang SVG Chef Hat icon -->
                    <svg class="brand-logo-icon" width="48" height="48" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z" />
                        <line x1="6" y1="17" x2="18" y2="17" />
                    </svg>

                    <!-- O kaya Kung Image file ang gamit mo (palitan ang src ng path ng logo mo): -->
                    <!-- <img src="assets/logo.png" alt="FoodHub Logo" class="brand-logo-img"> -->

                    <h1>FOODHUB</h1>
                </div>

                <p class="hero-tagline">
                    We serve you<br>
                    <span class="highlight-text">with a smile.</span>
                </p>
            </div>
            <div class="hero-footer-note">
                <p>© 2026 FOODHUB Systems. All rights reserved.</p>
            </div>
        </section>

        <!-- RIGHT SIDE: Modern Clean Login Form -->
        <section class="login-section">
            <div class="login-card">

                <div class="card-header-group">
                    <div class="chef-icon-wrapper">
                        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z" />
                            <line x1="6" y1="17" x2="18" y2="17" />
                        </svg>
                    </div>
                    <h2>Welcome Back</h2>
                    <p class="subtitle">Enter your credentials to access the admin side</p>
                </div>

                <form id="loginForm" novalidate>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                                <polyline points="22,6 12,13 2,6" />
                            </svg>
                            <input type="email" id="email" placeholder="admin@foodhub.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                            </svg>
                            <input type="password" id="password" placeholder="••••••••••••" required>
                        </div>
                    </div>

                    <div class="login-options">
                        <label class="checkbox-container">
                            <input type="checkbox" id="rememberMe">
                            <span class="checkmark"></span>
                            Remember me
                        </label>
                        <a href="#" class="forgot-link">Forgot password?</a>
                    </div>

                    <button type="submit" id="loginButton">
                        <span id="buttonText">Sign In to Dashboard</span>
                        <svg class="btn-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.5">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </button>

                    <p id="loginMessage" class="login-message"></p>

                </form>

            </div>
        </section>

    </main>

    <!-- JavaScript entry point -->
    <script type="module" src="js/main.js"></script>

</body>

</html>
