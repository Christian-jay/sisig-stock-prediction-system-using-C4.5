<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOODHUB — Admin System Settings</title>
    <!-- Google Fonts Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Custom Stylesheets -->
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="css/sidebar_nav.css">
    <link rel="stylesheet" href="css/topbar_nav.css">
</head>

<body>

    <div class="admin-layout">

        <!-- SIDEBAR -->
        <div id="sidebar-nav-container"></div>

        <!-- ================= MAIN CONTENT ================= -->
        <main class="main-content">

            <!-- TOP NAVBAR -->
            <div id="top-navbar-container"></div>

            <!-- PAGE CONTENT -->
            <div class="settings-dashboard-body">

                <!-- PAGE HEADER -->
                <div class="page-header">
                    <h1>System Settings</h1>
                    <p>Configure business info, payment modes, notifications, themes, and backups.</p>
                </div>

                <!-- SETTINGS LAYOUT WRAPPER -->
                <div class="settings-layout-grid">

                    <!-- SETTINGS SIDEBAR MENU -->
                    <div class="settings-sidebar">
                        <div class="card-box" style="padding: 12px;">
                            <ul class="settings-menu-list">
                                <li class="settings-menu-item active" data-tab="general">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2">
                                        <circle cx="12" cy="12" r="3"></circle>
                                        <path
                                            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l-.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                                        </path>
                                    </svg>
                                    <span>General</span>
                                </li>
                                <li class="settings-menu-item" data-tab="business">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2">
                                        <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                                        <line x1="3" y1="6" x2="21" y2="6"></line>
                                        <path d="M16 10a4 4 0 0 1-8 0"></path>
                                    </svg>
                                    <span>Business Info</span>
                                </li>
                                <li class="settings-menu-item" data-tab="notification">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2">
                                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                                    </svg>
                                    <span>Notification</span>
                                </li>
                                <li class="settings-menu-item" data-tab="payment">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2">
                                        <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
                                        <line x1="1" y1="10" x2="23" y2="10"></line>
                                    </svg>
                                    <span>Payment</span>
                                </li>
                                <li class="settings-menu-item" data-tab="backup">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2">
                                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                        <polyline points="17 8 12 3 7 8"></polyline>
                                        <line x1="12" y1="3" x2="12" y2="15"></line>
                                    </svg>
                                    <span>Backup & Logout</span>
                                </li>
                            </ul>
                        </div>
                    </div>

                    <!-- SETTINGS CONTENT AREA -->
                    <div class="settings-content-area">
                        <div class="card-box">
                            <form id="settingsForm">
                                <div id="settingsTabContent">
                                    <!-- Dynamic Tab Content is rendered here via JS -->
                                </div>
                            </form>
                        </div>
                    </div>

                </div>

            </div>

        </main>

    </div>

    <!-- Auth Guard - Must load before SettingsController -->
    <script type="module">
        import { protectPage } from './js/utils/AuthGuard.js';

        // Protect this page - only ADMIN can access
        protectPage({ allowedRoles: ['ADMIN'] }).then(userData => {
            if (userData) {
                window.currentUser = userData;
            }
        });
    </script>

    <script type="module" src="js/controllers/SettingsController.js"></script>

</body>

</html>
