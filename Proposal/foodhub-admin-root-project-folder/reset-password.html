<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOODHUB — Reset Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="../foodhub-staff-project-folder/css/themes.css">
</head>

<body>
    <!-- Apply saved theme immediately (before paint) -->
    <script>
      (function() {
        const theme = localStorage.getItem('foodhub_theme');
        if (theme === 'dark') {
          document.body.setAttribute('data-theme', theme);
        }
      })();
    </script>
    <main class="login-page">
        <!-- LEFT SIDE: Modern Hero & Brand Banner -->
        <section class="hero-section">
            <div class="hero-overlay"></div>
            <div class="hero-content">
                <div class="brand-header-flex">
                    <img src="./assets/foodhub_logo_no_bg.png" alt="foodhub"
                        loading="lazy" style="max-width: 20%; height: auto; display: block;">
                    <h1>FOODHUB</h1>
                </div>
                <p class="hero-tagline">
                    We serve you<br>
                    <span class="highlight-text">with a smile.</span>
                </p>
            </div>
            <div class="hero-footer-note">
                <p>© 2026 FOODHUB Systems. All rights reserved.</p>
            </div>
        </section>

        <!-- RIGHT SIDE: Reset Password Form -->
        <section class="login-section">
            <div class="login-card">
                <div class="card-header-group">
                    <div class="chef-icon-wrapper">
                        <img src="./assets/foodhub_logo_no_bg.png"
                            alt="FOODHUB Logo" loading="lazy"
                            style="width: 100%; max-width: 140px; height: 120px; object-fit: contain; display: block;">
                    </div>
                    <h2>Reset Password</h2>
                    <p class="subtitle">Enter your new password below. Must be at least 8 characters.</p>
                </div>

                <form id="resetPasswordForm" novalidate>
                    <div class="form-group">
                        <label for="newPassword">New Password</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                            </svg>
                            <input type="password" id="newPassword" placeholder="••••••••" required autocomplete="new-password" minlength="8">
                            <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                                <svg class="eye-icon eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg class="eye-icon eye-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                            </button>
                        </div>
                        <div class="password-strength" id="passwordStrength" style="display: none;">
                            <div class="strength-bar">
                                <div class="strength-fill" id="strengthFill"></div>
                            </div>
                            <span class="strength-text" id="strengthText"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm New Password</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                            </svg>
                            <input type="password" id="confirmPassword" placeholder="••••••••" required autocomplete="new-password" minlength="8">
                            <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                                <svg class="eye-icon eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg class="eye-icon eye-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                            </button>
                        </div>
                        <span class="form-hint" id="passwordMatchHint" style="display: none;"></span>
                    </div>

                    <button type="submit" id="submitButton" class="btn-login">
                        <span id="buttonText">Reset Password</span>
                        <svg class="btn-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.5">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </button>

                    <div id="formMessage" class="login-message" role="alert" aria-live="polite"></div>

                    <div class="login-options" style="margin-top: 24px; justify-content: center;">
                        <a href="login.html" class="forgot-link" style="font-size: 14px;">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 4px; vertical-align: middle;">
                                <line x1="19" y1="12" x2="5" y2="12"></line>
                                <polyline points="12 19 5 12 12 5"></polyline>
                            </svg>
                            Back to Login
                        </a>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <script type="module" src="js/controllers/ResetPasswordController.js"></script>
</body>
</html>
