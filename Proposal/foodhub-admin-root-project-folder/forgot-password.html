<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOODHUB — Forgot Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <main class="login-page">
        <!-- LEFT SIDE: Modern Hero & Brand Banner -->
        <section class="hero-section">
            <div class="hero-overlay"></div>
            <div class="hero-content">
                <div class="brand-header-flex">
                    <img src="./assets/foodhub_logo_no_bg.png" alt="foodhub"
                        loading="lazy" style="max-width: 20%; height: auto; display: block;">
                    <h1>FOODHUB</h1>
                </div>
                <p class="hero-tagline">
                    We serve you<br>
                    <span class="highlight-text">with a smile.</span>
                </p>
            </div>
            <div class="hero-footer-note">
                <p>© 2026 FOODHUB Systems. All rights reserved.</p>
            </div>
        </section>

        <!-- RIGHT SIDE: Forgot Password Form -->
        <section class="login-section">
            <div class="login-card">
                <div class="card-header-group">
                    <div class="chef-icon-wrapper">
                        <img src="./assets/foodhub_logo_no_bg.png"
                            alt="FOODHUB Logo" loading="lazy"
                            style="width: 100%; max-width: 140px; height: 120px; object-fit: contain; display: block;">
                    </div>
                    <h2>Forgot Password</h2>
                    <p class="subtitle">Enter your email address and we'll send you a link to reset your password</p>
                </div>

                <form id="forgotPasswordForm" novalidate>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                                <polyline points="22,6 12,13 2,6" />
                            </svg>
                            <input type="email" id="email" placeholder="user@foodhub.com" required autocomplete="email">
                        </div>
                    </div>

                    <button type="submit" id="submitButton" class="btn-login">
                        <span id="buttonText">Send Reset Link</span>
                        <svg class="btn-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.5">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </button>

                    <div id="formMessage" class="login-message" role="alert" aria-live="polite"></div>

                    <div class="login-options" style="margin-top: 24px; justify-content: center;">
                        <a href="login.html" class="forgot-link" style="font-size: 14px;">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 4px; vertical-align: middle;">
                                <line x1="19" y1="12" x2="5" y2="12"></line>
                                <polyline points="12 19 5 12 12 5"></polyline>
                            </svg>
                            Back to Login
                        </a>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <script type="module" src="js/controllers/ForgotPasswordController.js"></script>
</body>
</html>
